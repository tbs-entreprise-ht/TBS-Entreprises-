    const lines = cartItems.map((i) => `• ${i.name} x${i.qty} — ${fmt(i.price * i.qty)}`).join("%0A");
    const pay = form.payment === "cash" ? "Cash à la livraison" : `MonCash/NatCash (réf: ${form.moncashRef || "non renseignée"})`;
    return `Nouvelle commande ${ref}%0A%0A${lines}%0A%0ATotal: ${fmt(total)}%0A%0AClient: ${form.name}%0ATel: ${form.phone}%0AAdresse: ${form.address}, ${form.quartier}%0APaiement: ${pay}`;
  };

  const buildPlainOrderText = (ref) => {
    const lines = cartItems.map((i) => `${i.name} x${i.qty} — ${fmt(i.price * i.qty)}`).join("\n");
    const pay = form.payment === "cash" ? "Cash à la livraison" : `MonCash/NatCash (réf: ${form.moncashRef || "non renseignée"})`;
    return `Nouvelle commande ${ref}\n\n${lines}\n\nTotal: ${fmt(total)}\n\nClient: ${form.name}\nTel: ${form.phone}\nAdresse: ${form.address}, ${form.quartier}\nPaiement: ${pay}`;
  };

  const submitOrder = () => {
    const ref = "TBS-" + Math.floor(1000 + Math.random() * 9000);
    setOrderRef(ref);
    setView("done");
    const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${buildWhatsAppMessage(ref)}`;
    setTimeout(() => window.open(waLink, "_blank"), 300);
  };

  const copyOrder = () => {
    const text = buildPlainOrderText(orderRef);
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  };

  return (
    <div style={{ background: BRAND.navy, minHeight: "100vh", color: BRAND.cream, fontFamily: "'Barlow Condensed', 'Inter', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        .display { font-family: 'Anton', sans-serif; letter-spacing: 0.02em; }
        .body-font { font-family: 'Inter', sans-serif; }
        button { font-family: inherit; }
        input { font-family: 'Inter', sans-serif; }
        ::placeholder { color: #6B7690; }
      `}</style>

      <div style={{ maxWidth: 460, margin: "0 auto", minHeight: "100vh", background: BRAND.navy2, position: "relative", display: "flex", flexDirection: "column" }}>
        {/* Header */}
        <div style={{ padding: "20px 20px 14px", borderBottom: `1px solid ${BRAND.line}`, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          {view !== "shop" ? (
            <button onClick={() => setView(view === "checkout" ? "cart" : "shop")} style={{ background: "none", border: "none", color: BRAND.gold, display: "flex", alignItems: "center", gap: 4, cursor: "pointer" }}>
              <ArrowLeft size={18} />
              <span className="body-font" style={{ fontSize: 14 }}>Retour</span>
            </button>
          ) : (
            <div>
              <div className="display" style={{ fontSize: 22, color: BRAND.gold, lineHeight: 1 }}>TBS ENTREPRISE</div>
              <div className="body-font" style={{ fontSize: 11, color: "#8A93AC", marginTop: 2, letterSpacing: "0.05em" }}>BOUTIQUE OFFICIELLE</div>
            </div>
          )}
          {view === "shop" && (
            <button onClick={() => setView("cart")} style={{ position: "relative", background: BRAND.line, border: "none", borderRadius: 10, padding: 10, cursor: "pointer" }}>
              <ShoppingBag size={18} color={BRAND.cream} />
              {count > 0 && (
                <span style={{ position: "absolute", top: -6, right: -6, background: BRAND.gold, color: BRAND.navy, fontSize: 11, fontWeight: 700, borderRadius: 999, minWidth: 18, height: 18, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Inter', sans-serif" }}>
                  {count}
                </span>
              )}
            </button>
          )}
        </div>

        {/* SHOP VIEW */}
        {view === "shop" && (
          <>
            <div style={{ display: "flex", gap: 8, padding: "16px 20px 4px", overflowX: "auto" }}>
              {CATEGORIES.map((c) => (
                <button
                  key={c}
                  onClick={() => setCat(c)}
                  style={{
                    flexShrink: 0,
                    padding: "7px 16px",
                    borderRadius: 999,
                    border: `1px solid ${cat === c ? BRAND.gold : BRAND.line}`,
                    background: cat === c ? BRAND.gold : "transparent",
                    color: cat === c ? BRAND.navy : BRAND.cream,
                    fontSize: 13,
                    fontWeight: 600,
                    cursor: "pointer",
                  }}
                  className="body-font"
                >
                  {c}
                </button>
              ))}
            </div>

            <div style={{ padding: "16px 20px 100px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              {filtered.map((p) => (
                <div key={p.id} style={{ background: BRAND.navy, border: `1px solid ${BRAND.line}`, borderRadius: 14, padding: 14, position: "relative", opacity: p.inStock === false ? 0.55 : 1 }}>
                  {p.tag && p.inStock !== false && (
                    <span style={{ position: "absolute", top: 10, left: 10, fontSize: 10, background: BRAND.gold, color: BRAND.navy, padding: "2px 8px", borderRadius: 999, fontWeight: 700 }} className="body-font">
                      {p.tag.toUpperCase()}
                    </span>
                  )}
                  {p.inStock === false && (
                    <span style={{ position: "absolute", top: 10, left: 10, fontSize: 10, background: "#8A93AC", color: BRAND.navy, padding: "2px 8px", borderRadius: 999, fontWeight: 700 }} className="body-font">
                      RUPTURE
                    </span>
                  )}
                  {p.photo ? (
                    <div
                      onClick={() => setZoomProduct(p)}
                      style={{ height: 90, display: "flex", alignItems: "center", justifyContent: "center", padding: "6px 0 10px", cursor: "zoom-in" }}
                    >
                      <img src={p.photo} alt={p.name} style={{ maxHeight: "100%", maxWidth: "100%", objectFit: "contain", borderRadius: 8 }} />
                    </div>
                  ) : (
                    <div
                      onClick={() => setZoomProduct(p)}
                      style={{ fontSize: 40, textAlign: "center", padding: "14px 0 10px", cursor: "zoom-in" }}
                    >
                      {p.emoji}
                    </div>
                  )}
                  <div className="body-font" style={{ fontSize: 14, fontWeight: 600, marginBottom: 2 }}>{p.name}</div>
                  <div className="body-font" style={{ fontSize: 11.5, color: "#8A93AC", marginBottom: 8 }}>{p.desc}</div>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <span className="display" style={{ color: BRAND.gold, fontSize: 15 }}>{fmt(p.price)}</span>
                    <button
                      disabled={p.inStock === false}
                      onClick={() => p.inStock !== false && addToCart(p.id)}
                      style={{ background: p.inStock === false ? BRAND.line : BRAND.gold, border: "none", borderRadius: 8, width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", cursor: p.inStock === false ? "not-allowed" : "pointer" }}
                    >
                      <Plus size={16} color={p.inStock === false ? "#6B7690" : BRAND.navy} />
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {count > 0 && (
              <button
                onClick={() => setView("cart")}
                style={{
                  position: "absolute", bottom: 20, left: 20, right: 20,
                  background: BRAND.gold, border: "none", borderRadius: 12, padding: "14px 18px",
                  display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer",
                }}
              >
                <span className="body-font" style={{ color: BRAND.navy, fontWeight: 700, fontSize: 14 }}>Voir le panier ({count})</span>
                <span className="display" style={{ color: BRAND.navy, fontSize: 15 }}>{fmt(total)}</span>
              </button>
            )}
          </>
        )}

        {/* CART VIEW */}
        {view === "cart" && (
          <div style={{ padding: "16px 20px 24px", flex: 1, display: "flex", flexDirection: "column" }}>
            <div className="display" style={{ fontSize: 18, marginBottom: 16 }}>PANIER</div>
            {cartItems.length === 0 ? (
              <div className="body-font" style={{ color: "#8A93AC", fontSize: 14, textAlign: "center", marginTop: 40 }}>Ton panier est vide</div>
            ) : (
              <>
                <div style={{ display: "flex", flexDirection: "column", gap: 10, flex: 1 }}>
                  {cartItems.map((i) => (
                    <div key={i.id} style={{ display: "flex", alignItems: "center", gap: 12, background: BRAND.navy, border: `1px solid ${BRAND.line}`, borderRadius: 12, padding: 12 }}>
                      <div style={{ fontSize: 26 }}>{i.emoji}</div>
                      <div style={{ flex: 1 }}>
                        <div className="body-font" style={{ fontSize: 13.5, fontWeight: 600 }}>{i.name}</div>
                        <div className="display" style={{ color: BRAND.gold, fontSize: 13 }}>{fmt(i.price * i.qty)}</div>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, background: BRAND.line, borderRadius: 8, padding: "4px 6px" }}>
                        <button onClick={() => changeQty(i.id, -1)} style={{ background: "none", border: "none", cursor: "pointer", color: BRAND.cream, display: "flex" }}><Minus size={14} /></button>
                        <span className="body-font" style={{ fontSize: 13, minWidth: 14, textAlign: "center" }}>{i.qty}</span>
                        <button onClick={() => changeQty(i.id, 1)} style={{ background: "none", border: "none", cursor: "pointer", color: BRAND.cream, display: "flex" }}><Plus size={14} /></button>
                      </div>
                    </div>
                  ))}
                </div>

                <div style={{ marginTop: 20, borderTop: `1px solid ${BRAND.line}`, paddingTop: 16 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
                    <span className="body-font" style={{ color: "#8A93AC", fontSize: 14 }}>Total</span>
                    <span className="display" style={{ color: BRAND.gold, fontSize: 20 }}>{fmt(total)}</span>
                  </div>
                  <button
                    onClick={() => setView("checkout")}
                    style={{ width: "100%", background: BRAND.gold, border: "none", borderRadius: 12, padding: 14, cursor: "pointer" }}
                  >
                    <span className="body-font" style={{ color: BRAND.navy, fontWeight: 700, fontSize: 14 }}>Passer la commande</span>
                  </button>
                </div>
              </>
            )}
          </div>
        )}

        {/* CHECKOUT VIEW */}
        {view === "checkout" && (
          <div style={{ padding: "16px 20px 24px" }}>
            <div className="display" style={{ fontSize: 18, marginBottom: 16 }}>LIVRAISON</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <Field icon={<User size={15} />} placeholder="Nom complet" value={form.name} onChange={(v) => setForm({ ...form, name: v })} />
              <Field icon={<Phone size={15} />} placeholder="Numéro de téléphone" value={form.phone} onChange={(v) => setForm({ ...form, phone: v })} />
              <Field icon={<MapPin size={15} />} placeholder="Adresse" value={form.address} onChange={(v) => setForm({ ...form, address: v })} />
              <Field icon={<MapPin size={15} />} placeholder="Quartier / ville" value={form.quartier} onChange={(v) => setForm({ ...form, quartier: v })} />
            </div>

            <div className="body-font" style={{ fontSize: 13, color: "#8A93AC", margin: "18px 0 8px" }}>Mode de paiement</div>
            <div style={{ display: "flex", gap: 10 }}>
              {[{ id: "cash", label: "Cash à la livraison" }, { id: "moncash", label: "MonCash / NatCash" }].map((opt) => (
                <button
                  key={opt.id}
                  onClick={() => setForm({ ...form, payment: opt.id })}
                  style={{
                    flex: 1, padding: "12px 10px", borderRadius: 10,
                    border: `1px solid ${form.payment === opt.id ? BRAND.gold : BRAND.line}`,
                    background: form.payment === opt.id ? "rgba(201,162,39,0.12)" : "transparent",
                    color: form.payment === opt.id ? BRAND.gold : BRAND.cream,
                    fontSize: 12.5, cursor: "pointer",
                  }}
                  className="body-font"
                >
                  {opt.label}
                </button>
              ))}
            </div>

            {form.payment === "moncash" && (
              <div style={{ marginTop: 14, background: BRAND.navy, border: `1px solid ${BRAND.line}`, borderRadius: 12, padding: 14 }}>
                <div className="body-font" style={{ fontSize: 12.5, color: "#8A93AC", marginBottom: 8 }}>
                  Envoie le montant total à l'un de ces numéros, puis indique ta référence de transaction ci-dessous.
                </div>
                <div className="body-font" style={{ fontSize: 13, color: BRAND.cream, marginBottom: 4 }}>MonCash : <span style={{ color: BRAND.gold, fontWeight: 700 }}>{MONCASH_NUMBER}</span></div>
                <div className="body-font" style={{ fontSize: 13, color: BRAND.cream, marginBottom: 12 }}>NatCash : <span style={{ color: BRAND.gold, fontWeight: 700 }}>{NATCASH_NUMBER}</span></div>
                <Field icon={<Check size={15} />} placeholder="Référence de transaction" value={form.moncashRef} onChange={(v) => setForm({ ...form, moncashRef: v })} />
              </div>
            )}

            <div style={{ marginTop: 14, background: "rgba(201,162,39,0.08)", border: `1px solid ${BRAND.gold}`, borderRadius: 12, padding: 12 }}>
              <span className="body-font" style={{ fontSize: 12.5, color: BRAND.gold }}>🚚 Livraison assurée par notre équipe TBS Entreprise</span>
            </div>

            <div style={{ marginTop: 14, background: BRAND.navy, border: `1px solid ${BRAND.line}`, borderRadius: 12, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }} className="body-font">
                <span style={{ color: "#8A93AC" }}>{count} article{count > 1 ? "s" : ""}</span>
                <span className="display" style={{ color: BRAND.gold }}>{fmt(total)}</span>
              </div>
            </div>

            <button
              disabled={!canSubmit}
              onClick={submitOrder}
              style={{
                width: "100%", marginTop: 18, background: canSubmit ? BRAND.gold : BRAND.line, border: "none",
                borderRadius: 12, padding: 14, cursor: canSubmit ? "pointer" : "not-allowed",
              }}
            >
              <span className="body-font" style={{ color: canSubmit ? BRAND.navy : "#6B7690", fontWeight: 700, fontSize: 14 }}>Confirmer la commande</span>
            </button>
          </div>
        )}

        {/* DONE VIEW */}
        {view === "done" && (
          <div style={{ padding: "40px 24px", flex: 1, display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center" }}>
            <div style={{ width: 60, height: 60, borderRadius: "50%", background: BRAND.gold, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 20 }}>
              <Check size={30} color={BRAND.navy} />
            </div>
            <div className="display" style={{ fontSize: 20, marginBottom: 6 }}>COMMANDE ENREGISTRÉE</div>
            <div className="body-font" style={{ color: "#8A93AC", fontSize: 13.5, marginBottom: 4 }}>Référence</div>
            <div className="display" style={{ color: BRAND.gold, fontSize: 22, marginBottom: 24 }}>{orderRef}</div>

            <div style={{ width: "100%", background: BRAND.navy, border: `1px solid ${BRAND.line}`, borderRadius: 12, padding: 16, marginBottom: 20, textAlign: "left" }}>
              {cartItems.map((i) => (
                <div key={i.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 6 }} className="body-font">
                  <span>{i.name} x{i.qty}</span>
                  <span style={{ color: BRAND.gold }}>{fmt(i.price * i.qty)}</span>
                </div>
              ))}
              <div style={{ borderTop: `1px solid ${BRAND.line}`, marginTop: 8, paddingTop: 8, display: "flex", justifyContent: "space-between" }}>
                <span className="body-font" style={{ fontSize: 13, color: "#8A93AC" }}>Total</span>
                <span className="display" style={{ color: BRAND.gold, fontSize: 15 }}>{fmt(total)}</span>
              </div>
            </div>

            <div className="body-font" style={{ fontSize: 12.5, color: "#8A93AC", marginBottom: 14 }}>
              WhatsApp devrait s'ouvrir automatiquement. S'il ne s'ouvre pas, utilise les boutons ci-dessous.
            </div>

            <a
              href={`https://wa.me/${WHATSAPP_NUMBER}?text=${buildWhatsAppMessage(orderRef)}`}
              target="_blank"
              rel="noreferrer"
              style={{ width: "100%", background: "#25D366", borderRadius: 12, padding: 14, textDecoration: "none", display: "block" }}
            >
              <span className="body-font" style={{ color: "#0B1220", fontWeight: 700, fontSize: 14 }}>Envoyer sur WhatsApp</span>
            </a>

            <button
              onClick={copyOrder}
              style={{ width: "100%", marginTop: 10, background: BRAND.line, border: "none", borderRadius: 12, padding: 14, cursor: "pointer" }}
            >
              <span className="body-font" style={{ color: BRAND.cream, fontWeight: 700, fontSize: 14 }}>
                {copied ? "Copié ✓" : "Copier la commande"}
              </span>
            </button>

            <button
              onClick={() => { setCart({}); setView("shop"); setForm({ name: "", phone: "", address: "", quartier: "", payment: "cash", moncashRef: "" }); }}
              style={{ marginTop: 14, background: "none", border: "none", color: BRAND.gold, cursor: "pointer" }}
              className="body-font"
            >
              Continuer mes achats
            </button>
          </div>
        )}
      </div>

      {zoomProduct && (
        <div
          onClick={() => setZoomProduct(null)}
          style={{
            position: "fixed", inset: 0, background: "rgba(11,18,32,0.92)", zIndex: 50,
            display: "flex", alignItems: "center", justifyContent: "center", padding: 24,
          }}
        >
          <button
            onClick={() => setZoomProduct(null)}
            style={{
              position: "absolute", top: 20, right: 20, background: BRAND.line, border: "none",
              borderRadius: 10, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
            }}
          >
            <X size={18} color={BRAND.cream} />
          </button>

          <div
            onClick={(e) => e.stopPropagation()}
            style={{ maxWidth: 420, width: "100%", display: "flex", flexDirection: "column", alignItems: "center" }}
          >
            {zoomProduct.photo ? (
              <img
                src={zoomProduct.photo}
                alt={zoomProduct.name}
                style={{ maxWidth: "100%", maxHeight: "60vh", objectFit: "contain", borderRadius: 16, border: `1px solid ${BRAND.line}` }}
              />
            ) : (
              <div style={{ fontSize: 120, background: BRAND.navy2, width: "100%", aspectRatio: "1", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 16, border: `1px solid ${BRAND.line}` }}>
                {zoomProduct.emoji}
              </div>
            )}
            <div className="display" style={{ fontSize: 18, color: BRAND.cream, marginTop: 18, textAlign: "center" }}>{zoomProduct.name}</div>
            <div className="body-font" style={{ fontSize: 13, color: "#8A93AC", marginTop: 2 }}>{zoomProduct.desc}</div>
            <div className="display" style={{ fontSize: 20, color: BRAND.gold, marginTop: 10 }}>{fmt(zoomProduct.price)}</div>
            {zoomProduct.inStock === false ? (
              <div style={{ marginTop: 18, background: BRAND.line, borderRadius: 12, padding: "12px 28px" }}>
                <span className="body-font" style={{ color: "#8A93AC", fontWeight: 700, fontSize: 14 }}>Rupture de stock</span>
              </div>
            ) : (
              <button
                onClick={() => { addToCart(zoomProduct.id); setZoomProduct(null); }}
                style={{ marginTop: 18, background: BRAND.gold, border: "none", borderRadius: 12, padding: "12px 28px", cursor: "pointer" }}
              >
                <span className="body-font" style={{ color: BRAND.navy, fontWeight: 700, fontSize: 14 }}>Ajouter au panier</span>
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function Field({ icon, placeholder, value, onChange }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, background: "#0B1220", border: `1px solid ${BRAND.line}`, borderRadius: 10, padding: "12px 14px" }}>
      <span style={{ color: "#8A93AC" }}>{icon}</span>
      <input
        value={value}
        onChange={(e) => onChange(e.target.value)}
        placeholder={placeholder}
        style={{ background: "none", border: "none", outline: "none", color: BRAND.cream, fontSize: 14, flex: 1 }}
      />
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
